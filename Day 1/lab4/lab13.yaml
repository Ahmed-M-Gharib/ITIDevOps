apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  PAGE_TITLE: "ITI Kubernetes Lab"
  ENVIRONMENT: "dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-config-demo
  template:
    metadata:
      labels:
        app: web-config-demo
    spec:
      containers:
      - name: web-config-demo
        image: busybox:latest
        envFrom:
        - configMapRef:
            name: web-config
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "TITLE: $PAGE_TITLE | ENV: $ENVIRONMENT"
            sleep 10
          done