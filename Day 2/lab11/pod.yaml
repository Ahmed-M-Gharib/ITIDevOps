apiVersion: v1
kind: Pod
metadata:
  name: files-pod
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: files-vol
          mountPath: /etc/files
          readOnly: true
  volumes:
    - name: files-vol
      configMap:
        name: files-cm

