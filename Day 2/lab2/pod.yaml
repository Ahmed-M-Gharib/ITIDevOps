apiVersion: v1
kind: Pod
metadata:
  name: hostpath-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: node-storage
          mountPath: /data
  volumes:
    - name: node-storage
      hostPath:
        path: /tmp/hostpath-lab
        type: DirectoryOrCreate