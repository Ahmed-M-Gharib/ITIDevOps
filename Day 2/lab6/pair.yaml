apiVersion: v1
kind: Pod
metadata:
  name: pair-lab
  labels:
    app: multi-container-demo
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          mkdir -p /var/log/app &&
          while true; do
            date >> /var/log/app/out.txt;
            sleep 2;
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app

    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          while [ ! -f /var/log/app/out.txt ]; do sleep 1; done;
          tail -F /var/log/app/out.txt
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app