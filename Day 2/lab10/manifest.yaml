apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: student-expand
provisioner: rancher.io/local-path
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resize-lab-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: student-expand
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: resize-lab
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "resize-test" > /data/test.txt &&
          sleep 3600
      volumeMounts:
        - name: data-vol
          mountPath: /data
  volumes:
    - name: data-vol
      persistentVolumeClaim:
        claimName: resize-lab-pvc
